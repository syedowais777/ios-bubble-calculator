<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #1a1a2e;
            border: 3px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #0f3460;
        }

        .scoreboard {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            z-index: 10;
            pointer-events: none;
        }

        .score {
            text-align: center;
        }

        .score-label {
            font-size: 14px;
            color: #00ff00;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #00ff00;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
            pointer-events: none;
        }

        .game-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            opacity: 0;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-title.show {
            opacity: 1;
        }

        .info-panel {
            margin-top: 20px;
            text-align: center;
            color: #00ff00;
            font-size: 14px;
        }

        .info-panel p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div>
        <div class="game-container">
            <canvas id="pongCanvas" width="800" height="500"></canvas>
            <div class="scoreboard">
                <div class="score">
                    <div class="score-label">PLAYER</div>
                    <div id="playerScore">0</div>
                </div>
                <div class="score">
                    <div class="score-label">COMPUTER</div>
                    <div id="computerScore">0</div>
                </div>
            </div>
            <div class="game-title" id="gameTitle">PONG</div>
            <div class="controls">
                Use MOUSE or ARROW KEYS UP/DOWN to move your paddle | Press SPACE to start
            </div>
        </div>
        <div class="info-panel">
            <p>🎮 Control the left paddle to bounce the ball back to the computer's paddle (right side)</p>
            <p>First to 11 points wins! Good luck!</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddleHeight = 80;
        const paddleWidth = 10;
        const ballRadius = 8;

        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 6,
            score: 0
        };

        const computer = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 4.5,
            score: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 4,
            dy: 4,
            radius: ballRadius,
            speed: 4
        };

        let gameStarted = false;
        let gameOver = false;
        const winScore = 11;

        // Input handling
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (!gameStarted || gameOver) {
                    startGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            player.y = Math.max(0, Math.min(mouseY - paddleHeight / 2, canvas.height - paddleHeight));
        });

        function startGame() {
            gameStarted = true;
            gameOver = false;
            document.getElementById('gameTitle').classList.remove('show');
            resetBall();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            const angle = (Math.random() - 0.5) * (Math.PI / 4);
            const direction = Math.random() > 0.5 ? 1 : -1;
            ball.dx = direction * ball.speed * Math.cos(angle);
            ball.dy = ball.speed * Math.sin(angle);
        }

        function update() {
            if (!gameStarted) return;

            // Player paddle control with arrow keys
            if (keys['ArrowUp']) {
                player.y = Math.max(0, player.y - player.speed);
            }
            if (keys['ArrowDown']) {
                player.y = Math.min(canvas.height - paddleHeight, player.y + player.speed);
            }

            // Computer AI
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;
            const difference = ballCenter - computerCenter;

            if (Math.abs(difference) > 10) {
                if (difference > 0) {
                    computer.y = Math.min(canvas.height - paddleHeight, computer.y + computer.speed);
                } else {
                    computer.y = Math.max(0, computer.y - computer.speed);
                }
            }

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top and bottom walls
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
                ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
            }

            // Ball collision with paddles
            // Player paddle
            if (ball.dx < 0 &&
                ball.x - ball.radius < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height) {
                ball.dx *= -1;
                ball.x = player.x + player.width + ball.radius;
                
                // Add spin based on where the ball hits the paddle
                const hitPos = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                ball.dy += hitPos * 2;
            }

            // Computer paddle
            if (ball.dx > 0 &&
                ball.x + ball.radius > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height) {
                ball.dx *= -1;
                ball.x = computer.x - ball.radius;
                
                // Add spin based on where the ball hits the paddle
                const hitPos = (ball.y - (computer.y + computer.height / 2)) / (computer.height / 2);
                ball.dy += hitPos * 2;
            }

            // Ball out of bounds - score points
            if (ball.x - ball.radius < 0) {
                computer.score++;
                document.getElementById('computerScore').textContent = computer.score;
                if (computer.score >= winScore) {
                    endGame('COMPUTER WINS!');
                } else {
                    resetBall();
                }
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                document.getElementById('playerScore').textContent = player.score;
                if (player.score >= winScore) {
                    endGame('YOU WIN!');
                } else {
                    resetBall();
                }
            }

            // Limit ball speed
            const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            if (speed > ball.speed * 1.5) {
                ball.dx = (ball.dx / speed) * (ball.speed * 1.5);
                ball.dy = (ball.dy / speed) * (ball.speed * 1.5);
            }
        }

        function endGame(message) {
            gameStarted = false;
            gameOver = true;
            const title = document.getElementById('gameTitle');
            title.textContent = message;
            title.classList.add('show');
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            ctx.strokeStyle = '#00ff00';
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw paddles
            ctx.fillStyle = '#00ff00';
            ctx.shadowColor = 'rgba(0, 255, 0, 0.8)';
            ctx.shadowBlur = 10;
            
            // Player paddle
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Computer paddle
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);

            // Draw ball
            ctx.fillStyle = '#ff00ff';
            ctx.shadowColor = 'rgba(255, 0, 255, 0.8)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Show start message
        document.getElementById('gameTitle').textContent = 'PONG';
        document.getElementById('gameTitle').classList.add('show');

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
